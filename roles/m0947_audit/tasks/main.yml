---
# M0947 Audit
#
# Configures auditd, AIDE, and Falco on RHEL 9 OT hosts.
#
# ATT&CK ICS: M0947 — Audit
# CIS RHEL 9: 4.1.x (auditd), 1.4.1 (AIDE)
# STIG: RHEL-09-654xxx series

# ── auditd ──

- name: Ensure audit packages are installed
  ansible.builtin.dnf:
    name:
      - audit
      - audit-libs
      - audispd-plugins
    state: present
  when: m0947_auditd_enabled

- name: Configure auditd.conf
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
  loop:
    - { key: "max_log_file", value: "{{ m0947_auditd_max_log_file }}" }
    - { key: "max_log_file_action", value: "{{ m0947_auditd_max_log_file_action }}" }
    - { key: "num_logs", value: "{{ m0947_auditd_num_logs }}" }
    - { key: "space_left_action", value: "{{ m0947_auditd_space_left_action }}" }
    - { key: "admin_space_left_action", value: "{{ m0947_auditd_admin_space_left_action }}" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  notify: Restart auditd
  when: m0947_auditd_enabled

- name: Deploy ICS-specific audit rules
  ansible.builtin.copy:
    content: |
      # M0947 — ICS OT host audit rules
      # Generated by falco_mitre.ics_enforce

      # Privileged command execution
      -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k privilege_escalation
      -a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0 -k privilege_escalation

      # File integrity — critical OT directories
      -w /etc/passwd -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/sudoers -p wa -k privilege_escalation
      -w /etc/sudoers.d/ -p wa -k privilege_escalation

      # Network configuration changes
      -w /etc/sysconfig/network-scripts/ -p wa -k network_config
      -w /etc/NetworkManager/ -p wa -k network_config
      -w /etc/firewalld/ -p wa -k network_config
      -w /etc/nftables/ -p wa -k network_config

      # Kernel module loading
      -a always,exit -F arch=b64 -S init_module,finit_module -k kernel_modules
      -a always,exit -F arch=b32 -S init_module,finit_module -k kernel_modules

      # Time changes (critical for OT process integrity)
      -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time_change
      -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time_change
      -w /etc/localtime -p wa -k time_change

      # SELinux policy changes
      -w /etc/selinux/ -p wa -k selinux_policy

      # Cron and scheduled tasks
      -w /etc/crontab -p wa -k cron
      -w /etc/cron.d/ -p wa -k cron
      -w /var/spool/cron/ -p wa -k cron

      # Login and authentication
      -w /var/log/faillog -p wa -k logins
      -w /var/log/lastlog -p wa -k logins
      -w /var/log/btmp -p wa -k logins
      -w /var/run/utmp -p wa -k session

      # Make rules immutable (must be last)
      -e 2
    dest: /etc/audit/rules.d/90-ics-ot.rules
    mode: "0640"
    owner: root
    group: root
  notify: Reload auditd rules
  when: m0947_auditd_enabled

- name: Enable and start auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
  when: m0947_auditd_enabled

# ── AIDE ──

- name: Ensure AIDE is installed
  ansible.builtin.dnf:
    name: aide
    state: present
  when: m0947_aide_enabled

- name: Check if AIDE database exists
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db.gz
  register: m0947_aide_db
  when: m0947_aide_enabled

- name: Initialize AIDE database (first run only)
  ansible.builtin.command:
    cmd: aide --init
  when:
    - m0947_aide_enabled
    - not m0947_aide_db.stat.exists
  changed_when: true

- name: Move new AIDE database into place
  ansible.builtin.copy:
    src: /var/lib/aide/aide.db.new.gz
    dest: /var/lib/aide/aide.db.gz
    remote_src: true
    mode: "0600"
    owner: root
    group: root
  when:
    - m0947_aide_enabled
    - not m0947_aide_db.stat.exists

- name: Schedule AIDE daily check via cron
  ansible.builtin.cron:
    name: "AIDE integrity check"
    hour: "{{ m0947_aide_cron_hour }}"
    minute: "{{ m0947_aide_cron_minute }}"
    job: "/usr/sbin/aide --check | /usr/bin/logger -t aide-check"
    user: root
  when: m0947_aide_enabled

# ── Falco ──

- name: Deploy Falco rule files
  ansible.builtin.copy:
    src: "falco/{{ item }}"
    dest: "{{ m0947_falco_rules_dir }}/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop: "{{ m0947_falco_rule_files }}"
  notify: Restart falco
  when: m0947_falco_enabled
