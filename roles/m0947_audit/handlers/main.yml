---
- name: Restart auditd
  ansible.builtin.command:
    cmd: service auditd restart
  changed_when: true

- name: Reload auditd rules
  ansible.builtin.command:
    cmd: augenrules --load
  changed_when: true

- name: Restart falco
  ansible.builtin.systemd:
    name: falco
    state: restarted
    daemon_reload: true

- name: Restart falcosidekick
  ansible.builtin.systemd:
    name: falcosidekick
    state: restarted
