# Falcosidekick configuration for EDA webhook integration
#
# Deploy to /etc/falcosidekick/config.yaml on the Falco host.
# Falcosidekick receives Falco alerts and forwards them as
# structured JSON webhooks to the EDA controller.

debug: false
customfields:
  environment: ot
  managed_by: falco_mitre_ics_enforce

outputs:
  # Primary: EDA controller webhook
  webhook:
    address: "http://eda-controller:5000/webhook"
    method: POST
    minimumpriority: warning
    checkcert: false
    headers:
      Content-Type: application/json
      X-Source: falcosidekick
    customHeaders:
      X-ATT-CK-Domain: ics

  # Optional: stdout for debugging
  stdout:
    enabled: true
    outputformat: json
