# Falcosidekick configuration for EDA event stream integration
#
# Deploy to /etc/falcosidekick/config.yaml on the Falco host.
# Falcosidekick receives Falco alerts and forwards them as
# structured JSON to the AAP EDA event stream endpoint.

debug: false
customfields:
  environment: ot
  managed_by: falco_mitre_ics_enforce

outputs:
  # Primary: AAP EDA event stream endpoint
  webhook:
    address: "https://aap.nostromo.io:443/eda-event-streams/api/eda/v1/external_event_stream/3ed6a9a5-587c-454b-b4cd-7859842c9bae/post/"
    method: POST
    minimumpriority: warning
    checkcert: false
    headers:
      Content-Type: application/json
      Authorization: "{{ falcosidekick_eda_token }}"
    customHeaders:
      X-ATT-CK-Domain: ics
      X-Source: falcosidekick

  # Optional: stdout for debugging
  stdout:
    enabled: true
    outputformat: json
